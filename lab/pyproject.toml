[project]
name = "tomoz-lab"
version = "0.1.0"
description = "Datasets, training and evaluation for the Tomoz codec"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "ZeroXShot" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pydicom>=3.0",
]

[project.optional-dependencies]
# Model training (CPU is enough: the networks are small).
train = ["torch>=2.5"]
# Classical codecs used as baselines in the evaluation.
baselines = ["imagecodecs>=2025.3"]

[project.scripts]
tomoz-lab = "tomoz_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tomoz_lab"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["E741"]
allowed-confusables = ["×", "–"]

[tool.pytest.ini_options]
testpaths = ["tests"]
