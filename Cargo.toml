[workspace]
resolver = "3"
members = [
    "crates/tomoz-entropy",
    "crates/tomoz-dicom",
    "crates/tomoz-nn",
    "crates/tomoz-codec",
    "crates/tomoz-archive",
    "crates/tomoz-gateway",
    "crates/tomoz-cli",
    "crates/tomoz-python",
    "crates/tomoz-wasm",
]
# The Python extension is built by maturin (crates/tomoz-python/pyproject.toml);
# plain `cargo build` / `cargo test` skip it.
default-members = [
    "crates/tomoz-entropy",
    "crates/tomoz-dicom",
    "crates/tomoz-nn",
    "crates/tomoz-codec",
    "crates/tomoz-archive",
    "crates/tomoz-gateway",
    "crates/tomoz-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/ZeroXShot/tomoz"
homepage = "https://github.com/ZeroXShot/tomoz"
readme = "README.md"
authors = ["ZeroXShot"]
keywords = ["compression", "lossless", "medical-imaging", "dicom", "neural-network"]
categories = ["compression", "science", "multimedia::images"]

[workspace.dependencies]
tomoz-entropy = { path = "crates/tomoz-entropy", version = "0.1.0" }
tomoz-dicom = { path = "crates/tomoz-dicom", version = "0.1.0" }
tomoz-nn = { path = "crates/tomoz-nn", version = "0.1.0" }
tomoz-codec = { path = "crates/tomoz-codec", version = "0.1.0", default-features = false }
tomoz-archive = { path = "crates/tomoz-archive", version = "0.1.0" }
tomoz-gateway = { path = "crates/tomoz-gateway", version = "0.1.0" }

thiserror = "2.0"
crc32c = "0.6"
sha2 = "0.11"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
anyhow = "1.0"
flate2 = "1.0"
zstd = { version = "0.14", default-features = false }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "sync", "time"] }
hyper = { version = "1.7", features = ["server", "http1"] }
hyper-util = { version = "0.1.17", features = ["tokio", "server", "server-graceful", "http1"] }
http-body-util = "0.1.3"
http = "1.3"
bytes = "1.10"
rusqlite = { version = "0.40", features = ["bundled"] }
hmac = "0.13"
md-5 = "0.11"
crc32fast = "1.5"
percent-encoding = "2.3"
httpdate = "1.0"
toml = "1.1"
lru = "0.18"
tempfile = "3.20"
numpy = "0.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Test and benchmark tooling.
proptest = "1.6"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
float_cmp = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
explicit_iter_loop = "warn"
inefficient_to_string = "warn"
large_types_passed_by_value = "warn"
cast_possible_truncation = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.bench]
inherits = "release"
debug = true

# Codec tests push millions of samples through the coder; unoptimised builds
# would make them painfully slow.
[profile.test]
opt-level = 2

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
