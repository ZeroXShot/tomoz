name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: Format, lints and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown -p tomoz-wasm --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86-64 runners have AVX2; the Arm runners have the dot-product
          # extension. The kernel tests compare every available kernel with
          # the scalar reference, and the conformance test pins the exact
          # bytes of the containers, so each platform proves bit-exactness.
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-aarch64, os: macos-latest }
          - { name: windows-x86_64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The Python bindings are built and tested as a wheel (job "python").
      - run: cargo test --workspace --exclude tomoz-python --locked
      - name: Codec without threads
        run: cargo test -p tomoz-codec --no-default-features --locked
      - name: Conformance in release mode, best and scalar kernels
        shell: bash
        run: |
          cargo test -p tomoz-codec --release --test conformance --locked
          TOMOZ_KERNEL=scalar cargo test -p tomoz-codec --release --test conformance --locked

  wasm:
    name: WebAssembly and JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build and test (the conformance cases must give the native bytes)
        working-directory: crates/tomoz-wasm/js
        run: |
          npm run build
          npm test

  python:
    name: Python bindings (${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel and run the tests
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest numpy
          maturin build --release -m crates/tomoz-python/Cargo.toml --out dist
          pip install dist/*.whl
          pytest -q crates/tomoz-python/tests

  lab:
    name: Lab (datasets, training, evaluation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - working-directory: lab
        run: |
          uv sync --locked --group dev
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pytest -q

  gateway:
    name: S3 gateway with boto3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - run: cargo build --release -p tomoz-cli --locked
      - name: Start the gateway with throwaway credentials
        run: |
          dir="$RUNNER_TEMP/gateway"
          mkdir -p "$dir"
          secret="$(openssl rand -hex 24)"
          echo "::add-mask::$secret"
          printf 'ci-key:%s\n' "$secret" > "$dir/credentials"
          chmod 600 "$dir/credentials"
          cat > "$dir/gateway.toml" <<EOF
          listen = "127.0.0.1:9100"
          data_dir = "$dir/data"
          buckets = ["dicom"]
          [auth]
          credentials_file = "$dir/credentials"
          [compaction]
          quiet_seconds = 2
          interval_seconds = 1
          min_objects = 2
          EOF
          target/release/tomoz serve --config "$dir/gateway.toml" > "$dir/gateway.log" 2>&1 &
          echo "GATEWAY_PID=$!" >> "$GITHUB_ENV"
          echo "GATEWAY_SECRET=$secret" >> "$GITHUB_ENV"
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:9100/_tomoz/health && break; sleep 1; done
      - name: Exercise the S3 API, compaction and byte-exact reads
        working-directory: lab
        run: uv run --with boto3 python tests/gateway_compat.py http://127.0.0.1:9100 ci-key "$GATEWAY_SECRET" synthetic:40
      - name: Metrics and graceful shutdown
        run: |
          curl -fsS http://127.0.0.1:9100/_tomoz/metrics | grep -E '^tomoz_(compactions_total|archived_objects) '
          kill -TERM "$GATEWAY_PID"
          timeout 30 tail --pid="$GATEWAY_PID" -f /dev/null
      - if: failure()
        run: cat "$RUNNER_TEMP/gateway/gateway.log"

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: tomoz:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm tomoz:ci --version
